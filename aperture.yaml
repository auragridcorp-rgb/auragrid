# Generated by gen_aperture.py from aperture.yaml + pricing.yaml. Edit those, then rerun.
listenaddr: 127.0.0.1:8080
insecure: true
dbbackend: sqlite
sqlite:
  dbfile: aperture.db
authenticator:
  lndhost: 127.0.0.1:10009
  tlspath: /home/ubuntu/.lnd/tls.cert
  macdir: /home/ubuntu/.lnd/data/chain/bitcoin/mainnet
  network: mainnet
