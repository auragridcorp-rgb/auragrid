# Generated by gen_aperture.py from aperture.base.yaml + pricing.yaml. Edit those, then rerun.
listenaddr: 127.0.0.1:8080
insecure: true
dbbackend: sqlite
sqlite:
  dbfile: aperture.db
authenticator:
  lndhost: 127.0.0.1:10009
  tlspath: /home/ubuntu/.lnd/tls.cert
  macdir: /home/ubuntu/.lnd/data/chain/bitcoin/mainnet
  network: mainnet
services:
- name: free-feeds
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^(/api/v1/energy/grid|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/port\-congestion\-index|/api/v1/batch/spr\-stockpile)$
  auth: 'off'
  authwhitelistpaths:
  - ^(/api/v1/energy/grid|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/port\-congestion\-index|/api/v1/batch/spr\-stockpile)$
  price: 0
  ratelimits:
  - pathregexp: ^(/api/v1/energy/grid|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/port\-congestion\-index|/api/v1/batch/spr\-stockpile)$
    requests: 30
    per: 1m
    burst: 10
- name: public-free
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
  auth: 'off'
  authwhitelistpaths:
  - ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
  price: 0
  ratelimits:
  - pathregexp: ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
    requests: 60
    per: 1m
    burst: 20
