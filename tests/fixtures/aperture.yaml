# Frozen test copy generated from aperture.base.yaml + tests/fixtures/pricing.yaml
listenaddr: 127.0.0.1:8080
insecure: true
dbbackend: sqlite
sqlite:
  dbfile: aperture.db
authenticator:
  lndhost: 127.0.0.1:10009
  tlspath: /home/ubuntu/.lnd/tls.cert
  macdir: /home/ubuntu/.lnd/data/chain/bitcoin/mainnet
  network: mainnet
services:
- name: free-feeds
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^(/api/v1/batch/btc\-fees\-delayed|/api/v1/batch/earthquakes|/api/v1/energy/grid|/api/v1/batch/ln\-network\-daily|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/spr\-stockpile)$
  auth: 'off'
  authwhitelistpaths:
  - ^(/api/v1/batch/btc\-fees\-delayed|/api/v1/batch/earthquakes|/api/v1/energy/grid|/api/v1/batch/ln\-network\-daily|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/spr\-stockpile)$
  price: 0
  ratelimits:
  - pathregexp: ^(/api/v1/batch/btc\-fees\-delayed|/api/v1/batch/earthquakes|/api/v1/energy/grid|/api/v1/batch/ln\-network\-daily|/api/v1/batch/lng\-supply\-chain|/api/v1/batch/maritime\-weather|/api/v1/batch/spr\-stockpile)$
    requests: 30
    per: 1m
    burst: 10
- name: retired
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^(/api/v1/batch/agri\-yield|/api/v1/batch/ercot\-lmp|/api/v1/esg/carbon|/api/v1/batch/naval\-escalation|/api/v1/pro/.*|/api/v1/sample/.*)$
  auth: 'off'
  authwhitelistpaths:
  - ^(/api/v1/batch/agri\-yield|/api/v1/batch/ercot\-lmp|/api/v1/esg/carbon|/api/v1/batch/naval\-escalation|/api/v1/pro/.*|/api/v1/sample/.*)$
  price: 0
  ratelimits:
  - pathregexp: ^(/api/v1/batch/agri\-yield|/api/v1/batch/ercot\-lmp|/api/v1/esg/carbon|/api/v1/batch/naval\-escalation|/api/v1/pro/.*|/api/v1/sample/.*)$
    requests: 60
    per: 1m
    burst: 20
- name: fees-pass
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/api/v1/pass30/btc-fees$
  price: 63600
  timeout: 2592000
  dynamicprice:
    enabled: true
    grpcaddress: 127.0.0.1:10010
    insecure: true
- name: lightning-operator
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/api/v1/bundle/(btc-fees|ln-network)$
  price: 5000
  timeout: 2592000
- name: batch-btc-fees
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/api/v1/batch/btc-fees$
  price: 50
  timeout: 3600
- name: batch-ln-network
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/api/v1/batch/ln-network$
  price: 100
  timeout: 3600
- name: public-free
  hostregexp: .*
  address: 127.0.0.1:8000
  protocol: http
  pathregexp: ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
  auth: 'off'
  authwhitelistpaths:
  - ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
  price: 0
  ratelimits:
  - pathregexp: ^/(buy|terms|llms\.txt|openapi\.json|agent-manifest\.json|\.well-known/ai-plugin\.json|api/v1/sample/[a-z0-9-]+|api/v1/price/[a-z0-9/-]+)$
    requests: 60
    per: 1m
    burst: 20
